name: Android (ARM64 APK)

on:
  push:
    branches: [main, develop, "feature/**"]
    paths: ["qt/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["qt/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK e NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Dependências de sistema do Host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nasm meson pkg-config

      - name: Instalar Qt 6 (Host Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          arch: "linux_gcc_64"
          aqtversion: "==3.3.*"
          cache: true

      - name: Salvar caminho do Qt Host
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Qt 6 (Target Android ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          target: "android"
          arch: "android_arm64_v8a"
          modules: "qtmultimedia"
          aqtversion: "==3.3.*"
          cache: true

      - name: Cache do FFmpeg Android ARM64
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /home/runner/ffmpeg-android-output
          key: ffmpeg-android-arm64-v8a-ndk26-7.1-v1

      - name: Compilar FFmpeg compartilhado para Android (ARM64)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Javernaut/ffmpeg-android-maker.git "$RUNNER_TEMP/ffmpeg-maker"
          cd "$RUNNER_TEMP/ffmpeg-maker"
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          ./ffmpeg-android-maker.sh --source-tar=7.1 -android=26 -abis=arm64-v8a
          mkdir -p /home/runner/ffmpeg-android-output
          cp -r output/* /home/runner/ffmpeg-android-output/

      - name: Organizar e verificar arquivos do FFmpeg
        run: |
          if [ -d "/home/runner/ffmpeg-android-output/include/arm64-v8a" ]; then
            cp -r /home/runner/ffmpeg-android-output/include/arm64-v8a/* /home/runner/ffmpeg-android-output/include/ || true
          fi
          if [ -d "/home/runner/ffmpeg-android-output/lib/arm64-v8a" ]; then
            cp -r /home/runner/ffmpeg-android-output/lib/arm64-v8a/* /home/runner/ffmpeg-android-output/lib/ || true
          fi
          echo "=== Estrutura FFmpeg ==="
          ls -la /home/runner/ffmpeg-android-output
          ls -la /home/runner/ffmpeg-android-output/include || true
          ls -la /home/runner/ffmpeg-android-output/lib || true

      - name: Salvar Cache do FFmpeg Android
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/ffmpeg-android-output
          key: ffmpeg-android-arm64-v8a-ndk26-7.1-v1

      - name: Criar Keystore para assinatura do APK
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/openframe-release.keystore" \
            -alias openframe \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass openframe123 \
            -keypass openframe123 \
            -dname "CN=OpenFrame, OU=Mobile, O=OpenFrame, C=BR"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/openframe-release.keystore" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_ALIAS=openframe" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=openframe123" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=openframe123" >> "$GITHUB_ENV"

      - name: Configurar variável FFMPEG_ANDROID_ROOT
        run: echo "FFMPEG_ANDROID_ROOT=/home/runner/ffmpeg-android-output" >> "$GITHUB_ENV"

      - name: Configurar CMake para Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S qt -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_HOME" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=26 \
            -DFFMPEG_ROOT="/home/runner/ffmpeg-android-output" \
            -DCMAKE_FIND_ROOT_PATH="/home/runner/ffmpeg-android-output" \
            -DQT_ANDROID_SIGN_APK=ON \
            -DQT_ANDROID_KEYSTORE_PATH="$QT_ANDROID_KEYSTORE_PATH" \
            -DQT_ANDROID_KEYSTORE_ALIAS="$QT_ANDROID_KEYSTORE_ALIAS" \
            -DQT_ANDROID_KEYSTORE_STORE_PASS="$QT_ANDROID_KEYSTORE_STORE_PASS" \
            -DQT_ANDROID_KEYSTORE_KEY_PASS="$QT_ANDROID_KEYSTORE_KEY_PASS" \
            -DOPENFRAME_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ env.QT_ANDROID_KEYSTORE_PATH }}
          QT_ANDROID_KEYSTORE_ALIAS: ${{ env.QT_ANDROID_KEYSTORE_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ env.QT_ANDROID_KEYSTORE_STORE_PASS }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ env.QT_ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          cmake --build build-android --target OpenFrame --parallel
          find build-android -type d -name "android-build" -exec cp qt/packaging/android/gradle.properties {}/gradle.properties \; || true
          cmake --build build-android --target OpenFrame_make_apk --parallel || cmake --build build-android --target apk --parallel

      - name: Localizar APK gerado
        run: |
          mkdir -p dist-apk
          find build-android -name "*release-signed.apk" -exec cp {} dist-apk/OpenFrame-Android-arm64.apk \; || \
          find build-android -name "*.apk" -exec cp {} dist-apk/OpenFrame-Android-arm64.apk \;
          ls -la dist-apk/

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: OpenFrame-Android-arm64
          path: dist-apk/*.apk
          retention-days: 14
